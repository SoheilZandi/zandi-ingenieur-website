backend:
  name: github
  repo: SoheilZandi/zandi-ingenieur-website
  branch: main
media_folder: "media/uploads"
public_folder: "/media/uploads"
collections:
  - name: "site"
    label: "Website"
    files:
      - label: "Website-Inhalte"
        name: "website"
        file: "content/site.json"
        format: "json"
        fields:
          - {label: "Firmenname", name: "firmname", widget: "string"}
          - {label: "Untertitel", name: "subtitle", widget: "string"}
          - {label: "Hero-Titel", name: "hero_title", widget: "string"}
          - label: "Hero-Zeilen"
            name: "hero_lines"
            widget: "list"
            field: {label: "Text", name: "text", widget: "string"}
          - label: "Leistungen"
            name: "leistungen"
            widget: "list"
            fields:
              - {label: "Titel", name: "title", widget: "string"}
              - {label: "Text", name: "text", widget: "string"}
          - {label: "Name", name: "about_name", widget: "string"}
          - {label: "Qualifikation", name: "about_qualification", widget: "string"}
          - {label: "Über mich", name: "about_text", widget: "text"}
          - {label: "E-Mail", name: "email", widget: "string"}
          - {label: "Telefon", name: "phone", widget: "string"}
